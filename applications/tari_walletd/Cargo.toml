[package]
name = "tari_ootle_walletd"
publish = false
description = "The Tari wallet daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_common = { workspace = true }
tari_common_types = { workspace = true }
tari_crypto = { workspace = true }
tari_ootle_app_utilities = { workspace = true, features = ["allowed_hosts"] }
tari_shutdown = { workspace = true }
tari_ootle_wallet_crypto = { workspace = true, features = ["mmap-value-lookup"] }
tari_ootle_address = { workspace = true }
tari_ootle_wallet_sdk = { workspace = true }
tari_ootle_wallet_sdk_services = { workspace = true, features = ["indexer_client"] }
tari_ootle_wallet_storage_sqlite = { workspace = true }
tari_ootle_transaction = { workspace = true }
tari_ootle_common_types = { workspace = true }
tari_ootle_template_metadata = { workspace = true, features = ["json"] }
tari_engine_types = { workspace = true, features = ["extract-template-def"] }
tari_ootle_walletd_client = { workspace = true }
tari_template_builtin = { workspace = true }
tari_template_lib_types = { workspace = true }
tari_transaction_manifest = { workspace = true }
tari_sidechain = { workspace = true }
ootle_byte_type = { workspace = true }
tari_utilities = { workspace = true }

async-trait = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
blake2 = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true, features = ["typed-header", "cookie"] }
axum-jrpc = { workspace = true, features = ["anyhow_error"] }
clap = { workspace = true, features = ["derive", "env"] }
dirs-next = { workspace = true }
notify = "8.2.0"
config = { workspace = true }
dashmap = { workspace = true }
either = { workspace = true }
hex = { workspace = true }
humantime-serde = { workspace = true }
futures = { workspace = true }
include_dir = { workspace = true, optional = true }
indexmap = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
keyring-core = { workspace = true }
libsqlite3-sys = { workspace = true, features = ["bundled"] }
log = { workspace = true }
log4rs = { workspace = true, features = [
    "rolling_file_appender",
    "compound_policy",
    "size_trigger",
    "fixed_window_roller",
    "console_appender",
] }
mime_guess = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "default",
    "rt-multi-thread",
    "macros",
    "time",
] }
tower-http = { workspace = true, features = ["cors", "trace"] }
url = { workspace = true }
webrtc = "0.14.0"
# `danger-credential-internals` exposes a stored passkey's signature counter, which login checks.
webauthn-rs = { workspace = true, features = ["danger-credential-internals"] }
uuid = { workspace = true }
wasm-opt = "0.116.1"
tempfile.workspace = true
sha2 = { workspace = true }
subtle = { workspace = true }
time = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }
# webauthn-rs links OpenSSL. A hardened-runtime binary may only load dylibs signed by the same team
# or by Apple, so the binary carries its own statically linked OpenSSL.
openssl = { workspace = true, features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[dev-dependencies]
# Test-only, so the wallet binary does not carry the consensus engine: lets the config guard
# assert against the real network ceiling rather than drifting from a hand-copied number.
serde-saphyr = { workspace = true }
tari_consensus = { workspace = true }
tari_utilities = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[package.metadata.cargo-machete]
ignored = [
    # We want to bundle this lib
    "libsqlite3-sys",
    # Want to enable some log4rs features
    "log4rs",
    # Added due to a limitation with machete - this is used in attributes without a `use` import.
    "humantime-serde",
    # Only enables the `vendored` feature on macOS
    "openssl",
]

[features]
default = ["web_ui"]
web_ui = ["include_dir"]
