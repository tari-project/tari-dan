########################################################################################################################
#                                                                                                                      #
#                                     Wallet Daemon Configuration Options ()                                           #
#                                                                                                                      #
########################################################################################################################

[ootle_wallet_daemon]
# JSON-RPC and web UI listener address (default = "127.0.0.1:5100")
# json_rpc_address = "127.0.0.1:5100"

# Signaling server address (default = "127.0.0.1:9100")
# signaling_server_address = "127.0.0.1:9100"

# Allow apps to connect over WebRTC (webrtc.start). A connected app receives a token carrying the caller's permissions,
# so leave this off unless you use WebRTC apps. Also settable with --enable-webrtc. (default = false)
# enable_webrtc = false

# Host names a request may address the daemon by, beyond localhost, IP addresses and the host of webauthn.rp_origin.
# Add the name a reverse proxy forwards or a LAN/container host name; requests naming any other host are refused.
# "*" accepts every name. Also settable with --allowed-host. (default = [])
# allowed_hosts = ["wallet.internal"]

# The largest max_fee, in microtari, the wallet submits a transaction with. Larger requests are refused; dry runs are
# exempt. (default = 100000000, i.e. 100 TARI)
# max_fee_limit = 100000000

# How far the wallet trusts its indexer. "verify" commits a transaction's changes only once a proof of them verifies
# against the network's validator sets, and needs an indexer with verify_substate_proofs enabled. "trust" takes the
# indexer at its word, for development only. (default = "verify")
# indexer_trust = "verify"

# Write a fresh random local authentication token (`tc_...`) to `<base_path>/.cookie` (mode 0600) on startup and
# delete it on clean shutdown so local clients (`tari_wallet_cli`, `wallet_daemon_client`) can authenticate without
# setting `authentication = "none"`. Also settable with --cookie-auth. (default = true)
# cookie_auth = true

# Permission scopes granted to local clients authenticating with `<base_path>/.cookie`. Interactive user-only
# endpoints (key export, API-key management, transaction/signing request approvals) remain blocked for cookie tokens.
# Also settable with --cookie-scopes. (default = ["admin"])
# cookie_scopes = ["admin"]

[localnet.ootle_wallet_daemon]
# Indexer API URLs. The wallet picks one at random at startup and moves to the next if it stops responding.
# (default: ["http://127.0.0.1:18300"])
# indexer_api_url = ["http://127.0.0.1:18300"]
[esmeralda.ootle_wallet_daemon]
# Authentication method: "webauthn" (default) or "none" (dangerous: any local program can spend funds)
#authentication = "webauthn"
# Indexer API URLs for Esme.
indexer_api_url = ["https://esme-indexer-a.ootle.tari.com/", "https://esme-indexer-b.ootle.tari.com/"]
