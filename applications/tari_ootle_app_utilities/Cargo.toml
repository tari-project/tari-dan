[package]
name = "tari_ootle_app_utilities"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_common = { workspace = true }
tari_common_types = { workspace = true }
tari_crypto = { workspace = true, features = ["serde"] }
tari_ootle_common_types = { workspace = true }
tari_engine = { workspace = true, optional = true }
tari_ootle_storage = { workspace = true }
tari_epoch_oracles = { workspace = true, optional = true }
ootle-network = { workspace = true }
tari_engine_types = { workspace = true }
tari_template_lib = { workspace = true }
tari_ootle_transaction = { workspace = true }
tari_bor = { workspace = true, default-features = true }
tari_mmr = { workspace = true }
tari_networking = { workspace = true, optional = true }
tari_transaction_components = { workspace = true }
tari_sidechain = { workspace = true }
tari_sidechain_l1 = { workspace = true }
tari_hashing = { workspace = true }
tari_ootle_p2p = { workspace = true, optional = true }
ootle_serde = { workspace = true, features = ["std"] }
ootle_byte_type = { workspace = true, features = ["crypto"] }

anyhow = { workspace = true }
axum = { workspace = true, optional = true }
blake2 = { workspace = true }
bounded-vec = { workspace = true }
borsh = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["derive", "env"] }
dirs-next = { workspace = true }
libp2p-identity = { workspace = true, optional = true }
log = { workspace = true, features = ["std"] }
multiaddr = { workspace = true, optional = true }
rand = { workspace = true }
serde = { workspace = true, features = ["default", "derive", "rc"] }
serde_json5 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["default", "macros", "time", "sync", "rt-multi-thread", "fs", "net"] }
url = { workspace = true, features = ["serde"] }
toml = { workspace = true }
config = { workspace = true }
# Only the consensus constants file needs the consensus engine, so it is behind a feature: nothing
# that merely prices a transaction has to carry it.
tari_consensus = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tari_script = { workspace = true }
tari_ootle_storage_sqlite = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["execution"]
# Executing a transaction needs the engine, and the engine needs wasmer, which has no cranelift
# backend on Windows. The wallet daemon only prices and submits transactions, so it takes this
# crate without the feature and stays buildable there.
execution = ["dep:tari_engine"]
p2p = ["tari_networking", "tari_ootle_p2p", "libp2p-identity", "multiaddr"]
epoch_oracle = ["tari_epoch_oracles"]
consensus_constants = ["tari_consensus"]
# The host allow-list middleware, for the applications that serve operator HTTP endpoints.
allowed_hosts = ["dep:axum"]
