          fi

          # cd ${distDirPKG}
          # echo "Compute pkg shasum"
          # ${SHARUN} "${{ env.TS_FILENAME }}-${{ matrix.builds.name }}-${{ env.TARI_VERSION }}.pkg" \
          #   >> "${{ env.TS_FILENAME }}-${{ matrix.builds.name }}-${{ env.TARI_VERSION }}.pkg.sha256"
          # cat "${{ env.TS_FILENAME }}-${{ matrix.builds.name }}-${{ env.TARI_VERSION }}.pkg.sha256"
          # echo "Checksum verification for pkg is "
          # ${SHARUN} --check "${{ env.TS_FILENAME }}-${{ matrix.builds.name }}-${{ env.TARI_VERSION }}.pkg.sha256"

          echo "Compute archive shasum"
          ${SHARUN} "${{ env.BINFILE }}.zip" >> "${{ env.BINFILE }}.zip.sha256"
          echo "Show the shasum"
          cat "${{ env.BINFILE }}.zip.sha256"
          echo "Checksum verification archive is "
          ${SHARUN} --check "${{ env.BINFILE }}.zip.sha256"

      - name: Artifact upload for macOS pkg
        # Disabled
        if: ${{ false }}
        # if: startsWith(runner.os,'macOS')
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TS_FILENAME }}-${{ matrix.builds.name }}-${{ env.TARI_VERSION }}.pkg
          path: "${{ env.distDirPKG }}/${{ env.TS_FILENAME }}-${{ matrix.builds.name }}-${{ env.TARI_VERSION }}*.pkg*"

      - name: Sign Windows files with Trusted Signing
        if: ${{ ( startsWith(runner.os,'Windows') ) && ( env.AZURE_TENANT_ID != '' ) }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: Tari
          certificate-profile-name: Tarilabs
          files-folder: ${{ github.workspace }}${{ env.TS_DIST }}/
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ${{ env.TS_DESCRIPTION }}
          description-url: ${{ env.TS_URL }}

      - name: Verify Windows signing for archive pack
        if: ${{ ( startsWith(runner.os,'Windows') ) && ( env.AZURE_TENANT_ID != '' ) }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: powershell
        run: |
          .\buildtools\check_signatures.ps1 -ScanDir ".\${{ env.TS_DIST }}"

      - name: Build the Windows installer
        # Disabled
        if: ${{ false }}
        # if: startsWith(runner.os,'Windows')
        shell: cmd
        run: |
          cd buildtools
          "%programfiles(x86)%\Inno Setup 6\iscc.exe" "/DMyAppVersion=${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}-installer" "/DMinotariSuite=${{ env.TS_FILENAME }}" "/DTariSuitePath=${{ github.workspace }}${{ env.TS_DIST }}" "windows_inno_installer.iss"
          cd Output
          echo "Compute archive shasum"
          ${{ env.SHARUN }} "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}-installer.exe" >> "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}-installer.exe.sha256"
          echo "Show the shasum"
          cat "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}-installer.exe.sha256"
          echo "Checksum verification archive is "
          ${{ env.SHARUN }} --check "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}-installer.exe.sha256"

      - name: Sign Windows installer with Trusted Signing
        # Disabled
        if: ${{ false }}
        # if: ${{ ( startsWith(runner.os,'Windows') ) && ( env.AZURE_TENANT_ID != '' ) }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: Tari
          certificate-profile-name: Tarilabs
          files-folder: ${{ github.workspace }}/buildtools/Output/
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ${{ env.TS_DESCRIPTION }}
          description-url: ${{ env.TS_URL }}

      - name: Verify Windows signing for installer
        # Disabled
        if: ${{ false }}
        # if: ${{ ( startsWith(runner.os,'Windows') ) && ( env.AZURE_TENANT_ID != '' ) }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: powershell
        working-directory: ${{ github.workspace }}/buildtools/Output
        run: |
          ..\check_signatures.ps1 -ScanDir "."

      - name: Artifact upload for Windows installer
        # Disabled
        if: ${{ false }}
        # if: startsWith(runner.os,'Windows')
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.TS_FILENAME }}_windows_installer"
          path: "${{ github.workspace }}/buildtools/Output/*"

      - name: Audit tree and feedback for binaries
        if: ${{ ( ! matrix.builds.cross ) }}
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ env.MTS_SOURCE }}"
          echo "Audit binaries ..."
          cargo audit bin *tari*

      - name: Archive and Checksum Binaries
        if: ${{ ! ( ( startsWith(runner.os, 'macOS') && ( env.MACOS_NOTARY_ISSUER != '' ) ) ) }}
        env:
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        shell: bash
        run: |
          echo "Archive ${{ env.BINFILE }} too ${{ env.BINFILE }}.zip"
          cd "${{ env.MTS_SOURCE }}"
          echo "Compute files shasum"
          ${SHARUN} * >> "${{ env.BINFILE }}.sha256"
          echo "Show the shasum"
          cat "${{ env.BINFILE }}.sha256"
          echo "Checksum verification for files is "
          ${SHARUN} --check "${{ env.BINFILE }}.sha256"
          7z a "${{ env.BINFILE }}.zip" *
          echo "Compute archive shasum"
          ${SHARUN} "${{ env.BINFILE }}.zip" >> "${{ env.BINFILE }}.zip.sha256"
          echo "Show the shasum"
          cat "${{ env.BINFILE }}.zip.sha256"
          echo "Checksum verification archive is "
          ${SHARUN} --check "${{ env.BINFILE }}.zip.sha256"

      - name: Artifact upload for Archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TS_FILENAME }}_archive-${{ matrix.builds.name }}
          path: "${{ github.workspace }}${{ env.TS_DIST }}/${{ env.BINFILE }}.zip*"

      - name: Prep Standalone tari_ootle_walletd binary for upload
        shell: bash
        run: |
          set -xo pipefail
          cd "${{ env.MTS_SOURCE }}"
          cp -v "tari_ootle_walletd${{ env.TS_EXT }}" \
            "tari_ootle_walletd-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}${{ env.TS_EXT }}"
          echo "Compute files shasum"
          ${SHARUN} "tari_ootle_walletd-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}${{ env.TS_EXT }}" \
            >> "tari_ootle_walletd-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}${{ env.TS_EXT }}.sha256"
          echo "Show the shasum"
          cat "tari_ootle_walletd-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}${{ env.TS_EXT }}.sha256"
          echo "Checksum verification archive is "
          ${SHARUN} --check "tari_ootle_walletd-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}${{ env.TS_EXT }}.sha256"

      - name: Artifact upload for Standalone tari_ootle_walletd binary
        uses: actions/upload-artifact@v7
        with:
          name: tari_ootle_walletd-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}
          path: "${{ github.workspace }}${{ env.TS_DIST }}/tari_ootle_walletd-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}${{ env.TS_EXT }}*"

      - name: Publish linux-x86_64 binary to draft release early
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.builds.name == 'linux-x86_64' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ${{ github.workspace }}${{ env.TS_DIST }}/${{ env.BINFILE }}.zip
            ${{ github.workspace }}${{ env.TS_DIST }}/${{ env.BINFILE }}.zip.sha256
            ${{ github.workspace }}${{ env.TS_DIST }}/tari_ootle_walletd-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}${{ env.TS_EXT }}
            ${{ github.workspace }}${{ env.TS_DIST }}/tari_ootle_walletd-${{ env.TARI_VERSION }}-${{ env.VSHA_SHORT }}-${{ matrix.builds.name }}${{ env.TS_EXT }}.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  ledger-app:
    name: Building the Ledger device app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      # The device app versions independently of the workspace: it is installed on the device, not
      # released alongside the binaries, so its own version identifies what a user is flashing.
      - name: Declare Ledger app variables
        shell: bash
        run: |
          echo "VSHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          LEDGER_APP_VERSION=$(awk -F ' = ' '$1 ~ /^version/ \
            { gsub(/["]/, "", $2); printf("%s",$2); exit }' \
            "$GITHUB_WORKSPACE/crates/wallet/ledger/app/Cargo.toml")
          echo "LEDGER_APP_VERSION=${LEDGER_APP_VERSION}" >> $GITHUB_ENV

      # Builds in the Ledger builder image; the embedded Rust toolchain and device SDKs live there.
      - name: Build the device app for every target
        run: ./crates/wallet/ledger/app/build-app.sh all

      - name: Collect ELFs and checksum
        shell: bash
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist-ledger"
          mkdir -p "${DIST}"
          for elf in "$GITHUB_WORKSPACE"/crates/wallet/ledger/app/target/*/release/ootle; do
            device=$(basename "$(dirname "$(dirname "${elf}")")")
            cp -v "${elf}" \
              "${DIST}/${TS_FILENAME}_ledger_app-${LEDGER_APP_VERSION}-${VSHA_SHORT}-${device}.elf"
          done
          cd "${DIST}"
          shasum --algorithm 256 *.elf \
            >> "${TS_FILENAME}_ledger_app-${LEDGER_APP_VERSION}-${VSHA_SHORT}.sha256"
          shasum --algorithm 256 --check "${TS_FILENAME}_ledger_app-${LEDGER_APP_VERSION}-${VSHA_SHORT}.sha256"
          ls -alht

      # Named with the `tari_ootle` prefix so `create-release` picks it up with the other artifacts.
      - name: Artifact upload for the Ledger app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TS_FILENAME }}_ledger_app-${{ env.LEDGER_APP_VERSION }}-${{ env.VSHA_SHORT }}
          path: "${{ github.workspace }}/dist-ledger/*"

  # A leg that fails must leave the run red, so the draft is assembled from whatever did build
  # rather than being skipped along with the failure.
  create-release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}

    runs-on: ubuntu-latest
    needs: [ builds, ledger-app ]

    env:
      TARI_NETWORK_DIR: ${{ needs.builds.outputs.TARI_NETWORK_DIR }}
      TARI_VERSION: ${{ needs.builds.outputs.TARI_VERSION }}

    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: ${{ env.TS_FILENAME }}
          pattern: "${{ env.TS_FILENAME }}*"
          merge-multiple: true

      - name: Verify checksums and Prep Uploads
        shell: bash
        working-directory: ${{ env.TS_FILENAME }}
        run: |
          # set -xo pipefail
          sudo apt-get update
          sudo apt-get --no-install-recommends --assume-yes install dos2unix
          ls -alhtR
          if [ -f "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}.${{ env.TS_SIG_FN }}" ] ; then
            rm -fv "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}.${{ env.TS_SIG_FN }}"
          fi

          # Merge all sha256 files into one
          find . -name "*.sha256" -type f -print | \
            xargs cat >> "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}.${{ env.TS_SIG_FN }}"

          # Remove any Windows carriage returns that may have been introduced by Windows runners
          dos2unix --quiet "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}.${{ env.TS_SIG_FN }}"
          cat "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}.${{ env.TS_SIG_FN }}"
          sha256sum --ignore-missing --check "${{ env.TS_FILENAME }}-${{ env.TARI_VERSION }}.${{ env.TS_SIG_FN }}"
          ls -alhtR

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.TS_FILENAME }}*/**/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

      - name: Sync assets to S3
        continue-on-error: true
        if: ${{ env.AWS_SECRET_ACCESS_KEY != '' && matrix.builds.runs-on != 'self-hosted' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3CMD: "cp"
          S3OPTIONS: '--recursive --exclude "*" --include "*.sha256*" --include "*.zip*" --include "*.pkg*" --include "*installer.exe*"'
        shell: bash
        working-directory: ${{ env.TS_FILENAME }}
        run: |
          echo "Upload processing ..."
          ls -alhtR
          echo "Clean up"
          # Bash check if file with wildcards, does not work as expected
          # if [ -f ${{ env.TS_FILENAME }}*diag-utils* ] ; then
          if ls ${{ env.TS_FILENAME }}*diag-utils* > /dev/null 2>&1 ; then
            rm -fv ${{ env.TS_FILENAME }}*diag-utils*
          fi
          echo "Folder setup"
          if ls ${{ env.TS_FILENAME }}*linux* > /dev/null 2>&1 ; then
            mkdir -p "linux/${{ env.TARI_NETWORK_DIR }}/"
            mv -v ${{ env.TS_FILENAME }}*linux* "linux/${{ env.TARI_NETWORK_DIR }}/"
          fi
          if ls ${{ env.TS_FILENAME }}*macos* > /dev/null 2>&1 ; then
            mkdir -p "osx/${{ env.TARI_NETWORK_DIR }}/"
            mv -v ${{ env.TS_FILENAME }}*macos* "osx/${{ env.TARI_NETWORK_DIR }}/"
          fi
          if ls ${{ env.TS_FILENAME }}*windows* > /dev/null 2>&1 ; then
            mkdir -p "windows/${{ env.TARI_NETWORK_DIR }}/"
            mv -v ${{ env.TS_FILENAME }}*windows* "windows/${{ env.TARI_NETWORK_DIR }}/"
          fi
          ls -alhtR
          aws --version
          echo "ls current"
          aws s3 ls --region ${{ secrets.AWS_REGION }} \
            s3://${{ secrets.AWS_S3_BUCKET }}/current/
          echo "Upload current"
          aws s3 ${{ env.S3CMD }} --region ${{ secrets.AWS_REGION }} \
            . \
            s3://${{ secrets.AWS_S3_BUCKET }}/current/ \
            ${{ env.S3OPTIONS }}
