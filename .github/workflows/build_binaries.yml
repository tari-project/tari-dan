---
name: Build Matrix of Binaries

'on':
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
    branches:
      - "build-all-*"
      - "build-bins-*"
  schedule:
    # Off-peak and off the hour: GitHub defers scheduled runs queued at popular slots,
    # so a nightly asked for on the hour starts hours after the time it names.
    - cron: "37 20 * * *"
  workflow_dispatch:

env:
  # Matches the protoc that ubuntu-latest ships, which the ci workflow builds these protos against.
  PROTOC_VERSION: "21.12"
  TS_FILENAME: "tari_ootle"
  TS_BUNDLE_ID_BASE: "com.tari.ootle.pkg"
  TS_SIG_FN: "sha256-unsigned.txt"
  ## Must be a JSON string
  TS_FILES: '["tari_ootle_walletd","tari_indexer","tari_validator_node","tari_swarm_daemon"]'
  ## Binaries exposed as standalone downloads
  TS_FILES_STANDALONE: '["tari_ootle_walletd"]'
  TS_FEATURES: "default"
  TS_LIBRARIES: ""
  TS_EXT: "" # or ".exe" for Windows builds
  TS_DESCRIPTION: "Tari Ootle"
  TS_URL: "https://tari.com"
  # For debug builds
  # TS_BUILD: "debug"
  TS_BUILD: "release"
  TARI_TARGET_NETWORK: igor
  TARI_NETWORK: igor
  toolchain: 1.97.1
  matrix-json-file: ".github/workflows/build_binaries.json"
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_UNSTABLE_SPARSE_REGISTRY: true
  CARGO: cargo
  CARGO_OPTIONS: "--locked"
  CARGO_CACHE: true
  RUSTUP_PERMIT_COPY_RENAME: true

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Cancel superseded runs on adhoc build branches. Never cancel release tag builds.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set Matrix
        id: set-matrix
        run: |
          #
          # build all targets images
          # matrix=$( jq -s -c .[] .github/workflows/build_binaries.json )
          #
          # build only single target image
          # matrix_selection=$( jq -c '.[] | select( ."name" == "windows-x64" )' ${{ env.matrix-json-file }} )
          # matrix_selection=$( jq -c '.[] | select( ."name" | contains("macos") )' ${{ env.matrix-json-file }} )
          #
          # build select target images - build_enabled
          matrix_selection=$( jq -c '.[] | select( ."build_enabled" != false )' ${{ env.matrix-json-file }} )
          #
          # Setup the json build matrix
          matrix=$(echo ${matrix_selection} | jq -s -c '{"builds": .}')
          echo $matrix
          echo $matrix | jq .
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT

  matrix-check:
    # Debug matrix
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: matrix-prep
    steps:
      - name: Install json2yaml
        run: |
          sudo npm install -g json2yaml

      - name: Check matrix definition
        run: |
          matrix='${{ needs.matrix-prep.outputs.matrix }}'
          echo $matrix
          echo $matrix | jq .
          echo $matrix | json2yaml

  builds:
    name: Building ${{ matrix.builds.name }} on ${{ matrix.builds.runs-on }}
    needs: matrix-prep
    continue-on-error: ${{ matrix.builds.best_effort || false }}
    permissions:
      contents: write
    outputs:
      TARI_VERSION: ${{ steps.set-tari-vars.outputs.TARI_VERSION }}
      VSHA_SHORT: ${{ steps.set-tari-vars.outputs.VSHA_SHORT }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-prep.outputs.matrix) }}

    runs-on: ${{ matrix.builds.runs-on }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Declare Global Variables 4 GHA ${{ github.event_name }}
        id: set-tari-vars
        shell: bash
        run: |
          echo "VBRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          VSHA_SHORT=$(git rev-parse --short HEAD)
          echo "VSHA_SHORT=${VSHA_SHORT}" >> $GITHUB_ENV
          echo "VSHA_SHORT=${VSHA_SHORT}" >> $GITHUB_OUTPUT
          TARI_VERSION=$(awk -F ' = ' '$1 ~ /^version/ \
            { gsub(/["]/, "", $2); printf("%s",$2) }' \
            "$GITHUB_WORKSPACE/Cargo.toml")
          echo "TARI_VERSION=${TARI_VERSION}" >> $GITHUB_ENV
          echo "TARI_VERSION=${TARI_VERSION}" >> $GITHUB_OUTPUT
          if [[ "${{ matrix.builds.features }}" == "" ]]; then
            echo "BUILD_FEATURES=${{ env.TS_FEATURES }}" >> $GITHUB_ENV
          else
            echo "BUILD_FEATURES=${{ matrix.builds.features }}" >> $GITHUB_ENV
          fi
          TARGET_BINS=""
          if [[ "${{ matrix.builds.target_bins }}" == "" ]]; then
            ARRAY_BINS=( $(echo ${TS_FILES} | jq --raw-output '.[]' | awk '{ print $1 }') )
          else
            ARRAY_BINS=( $(echo "${{ matrix.builds.target_bins }}" | tr ', ' '\n') )
          fi
          # `--package` must accompany `--bin`: without it cargo selects every workspace member and
          # resolves their dependencies too, so a target that only builds the wallet daemon still
          # pulls in crates it cannot compile (the engine's cranelift backend has no Windows
          # support). Each binary here is named after the package that owns it.
          for BIN_FILE in "${ARRAY_BINS[@]}"; do
            echo "Adding ${BIN_FILE} to Builds"
            TARGET_BINS+="--package ${BIN_FILE} --bin ${BIN_FILE} "
          done
          echo "TARGET_BINS=${TARGET_BINS}" >> $GITHUB_ENV
          TARGET_LIBS=""
          if [[ "${{ matrix.builds.target_libs }}" == "" ]]; then
            ARRAY_LIBS=( $(echo ${TS_LIBRARIES} | tr ', ' '\n') )
          else
            ARRAY_LIBS=( $(echo "${{ matrix.builds.target_libs }}" | tr ', ' '\n') )
          fi
          for LIB_FILE in "${ARRAY_LIBS[@]}"; do
            echo "Adding ${LIB_FILE} to library Builds"
            TARGET_LIBS+="--package ${LIB_FILE} "
          done
          echo "TARGET_LIBS=${TARGET_LIBS}" >> $GITHUB_ENV
          TARI_BUILD_ISA_CPU=${{ matrix.builds.target }}
          # Strip unknown part
          TARI_BUILD_ISA_CPU=${TARI_BUILD_ISA_CPU//-unknown-linux-gnu}
          # Strip gc used by rust
          TARI_BUILD_ISA_CPU=${TARI_BUILD_ISA_CPU//gc}
          echo "TARI_BUILD_ISA_CPU=${TARI_BUILD_ISA_CPU}" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.builds.rust }}
          targets: ${{ matrix.builds.target }}

      - uses: rui314/setup-mold@v1

      - name: wasm target install
        run: rustup target add wasm32-unknown-unknown

      - name: Install Linux dependencies - Ubuntu
        if: ${{ startsWith(runner.os,'Linux') && ( ! matrix.builds.cross ) }}
        run: |
          sudo apt-get update
          sudo bash scripts/install_ubuntu_dependencies.sh

      # The upstream grpc protos use proto3 optional fields, which protoc only accepts natively from
      # 3.15 on. The Linux legs pin an older image for its lower glibc floor, and that image's apt
      # protoc predates 3.15, so a current protoc must take precedence over the distro one on PATH.
      - name: Install protoc - Ubuntu
        if: ${{ startsWith(runner.os,'Linux') && ( ! matrix.builds.cross ) }}
        run: |
          set -euo pipefail
          case "${{ runner.arch }}" in
            X64) protoc_arch=x86_64 ;;
            ARM64) protoc_arch=aarch_64 ;;
            *) echo "Unsupported runner arch: ${{ runner.arch }}" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-${protoc_arch}.zip"
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          rm -f /tmp/protoc.zip
          command -v protoc
          protoc --version

      - name: Install Linux dependencies - Ubuntu - local cross-compiled ${{ env.TARI_BUILD_ISA_CPU }} on x86-64
        # Disabled
        if: ${{ false }}
        # if: ${{ startsWith(runner.os,'Linux') && ( ! matrix.builds.cross ) && matrix.builds.name != 'linux-x86_64' }}
        run: |
          sudo apt-get update
          sudo bash scripts/install_ubuntu_dependencies-cross_compile.sh ${{ env.TARI_BUILD_ISA_CPU }}
          rustup target add ${{ matrix.builds.target }}
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/${{ env.TARI_BUILD_ISA_CPU }}-linux-gnu/" >> $GITHUB_ENV

      - name: Install macOS dependencies
        if: startsWith(runner.os,'macOS')
        run: |
          # cmake and autoconf already installed
          brew install zip coreutils automake protobuf
          rustup target add ${{ matrix.builds.target }}

      - name: Install macOS-14 missing dependencies - hack
        if: ${{ startsWith(runner.os,'macOS') && startsWith(runner.arch,'ARM64') }}
        run: |
          brew install libtool

      # vcpkg builds OpenSSL from source, which is the single most expensive step on a Windows
      # runner. vcpkg's own ABI hashing decides whether a cached archive still applies, so a stale
      # restore costs a rebuild rather than a wrong binary. Tag runs read the cache the scheduled
      # runs on the default branch populate.
      - name: Cache vcpkg binaries - Windows
        if: startsWith(runner.os,'Windows')
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ matrix.builds.name }}-${{ hashFiles('.github/workflows/build_binaries.yml') }}
          restore-keys: |
            vcpkg-${{ matrix.builds.name }}-

      - name: Install Windows dependencies
        if: startsWith(runner.os,'Windows')
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-cache,readwrite'
        run: |
          vcpkg.exe install sqlite3:x64-windows zlib:x64-windows
          # webauthn-rs pulls in openssl through webauthn-attestation-ca
          vcpkg install openssl:${{ matrix.builds.vcpkg_openssl_triplet }}
          # Bug in choco - need to install each package individually
          choco upgrade llvm -y
          # psutils is out of date
          # choco upgrade psutils -y
          choco upgrade protoc -y
          rustup target add ${{ matrix.builds.target }}

      # liblmdb-sys pulls in gcc 0.3.55, whose MSVC probe knows no aarch64 target and so falls back to a
      # bare `cl.exe` that is not on PATH by default. Entering the cross developer environment puts the
      # ARM64-targeting cl.exe on PATH, which is what that fallback needs to resolve.
      - name: Enter MSVC ARM64 cross environment - Windows
        if: ${{ matrix.builds.target == 'aarch64-pc-windows-msvc' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64_arm64

      # rustc has no linker discovery for aarch64-pc-windows-msvc and spawns a bare `link.exe`,
      # which under Git bash resolves to Git for Windows' coreutils `link` before the MSVC one.
      # Resolving it in pwsh, where only the cross environment's entries are on PATH, gives cargo
      # the absolute path to the ARM64-targeting linker.
      - name: Pin the MSVC linker - Windows ARM64
        if: ${{ matrix.builds.target == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $link = Get-Command link.exe -All |
            Where-Object { $_.Source -like '*\VC\Tools\MSVC\*' } |
            Select-Object -First 1
          if (-not $link) { throw "No MSVC link.exe on PATH" }
          Write-Output "Using linker: $($link.Source)"
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$($link.Source)" >> $env:GITHUB_ENV

      - name: Install Dependencies - Node
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: true

      - name: Set environment variables - Nix
        if: ${{ ! startsWith(runner.os,'Windows') }}
        shell: bash
        run: |
          echo "SHARUN=shasum --algorithm 256" >> $GITHUB_ENV
          echo "CC=gcc" >> $GITHUB_ENV
          echo "TS_EXT=" >> $GITHUB_ENV
          echo "LIB_PRE=lib" >> $GITHUB_ENV
          echo "SHELL_EXT=.sh" >> $GITHUB_ENV
          echo "PLATFORM_SPECIFIC_DIR=linux" >> $GITHUB_ENV
          echo "TS_DIST=/dist" >> $GITHUB_ENV

      - name: Set environment variables - macOS
        if: startsWith(runner.os,'macOS')
        shell: bash
        run: |
          echo "PLATFORM_SPECIFIC_DIR=osx" >> $GITHUB_ENV
          echo "LIB_EXT=.dylib" >> $GITHUB_ENV

      # Hardcoded sdk for MacOSX on ARM64
      - name: Set environment variables - macOS - ARM64 (pin/sdk)
        # Debug
        if: ${{ false }}
        # if: ${{ startsWith(runner.os,'macOS') && matrix.builds.name == 'macos-arm64' }}
        run: |
          xcrun --show-sdk-path
          ls -alhtR "/Library/Developer/CommandLineTools/SDKs/"
          echo "RANDOMX_RS_CMAKE_OSX_SYSROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX12.1.sdk" >> $GITHUB_ENV

      - name: Set environment variables - Ubuntu
        if: startsWith(runner.os,'Linux')
        shell: bash
        run: |
          echo "LIB_EXT=.so" >> $GITHUB_ENV

      - name: Set environment variables - Windows
        if: startsWith(runner.os,'Windows')
        shell: bash
        run: |
          # echo "SHARUN=pwsh C:\ProgramData\chocolatey\lib\psutils\tools\psutils-master\shasum.ps1 --algorithm 256" >> $GITHUB_ENV
          mkdir -p "$GITHUB_WORKSPACE\psutils"
          curl -v -o "$GITHUB_WORKSPACE\psutils\getopt.ps1" "https://raw.githubusercontent.com/lukesampson/psutils/master/getopt.ps1"
          curl -v -o "$GITHUB_WORKSPACE\psutils\shasum.ps1" "https://raw.githubusercontent.com/lukesampson/psutils/master/shasum.ps1"
          echo "SHARUN=pwsh $GITHUB_WORKSPACE\psutils\shasum.ps1 --algorithm 256" >> $GITHUB_ENV
          echo "TS_EXT=.exe" >> $GITHUB_ENV
          echo "LIB_EXT=.dll" >> $GITHUB_ENV
          echo "LIB_PRE=" >> $GITHUB_ENV
          echo "SHELL_EXT=.bat" >> $GITHUB_ENV
          echo "TS_DIST=\dist" >> $GITHUB_ENV
          echo "PLATFORM_SPECIFIC_DIR=windows" >> $GITHUB_ENV
          echo "SQLITE3_LIB_DIR=C:\vcpkg\installed\x64-windows\lib" >> $GITHUB_ENV
          OPENSSL_VAR="$(echo "${{ matrix.builds.target }}" | tr 'a-z-' 'A-Z_')_OPENSSL_DIR"
          echo "${OPENSSL_VAR}=C:\vcpkg\packages\openssl_${{ matrix.builds.vcpkg_openssl_triplet }}" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $GITHUB_ENV

      # A tag run restores the dependency cache the scheduled runs on the default branch save, but
      # never writes one: the cache a release build reads must be one that was produced before the
      # tag existed. Other branches don't save either; nothing restores their entries, and they
      # evict development's from the 10 GB repo cap. rust-cache keeps only dependencies, so every workspace crate — and the binary
      # itself — is still compiled from source on the tag's own commit.
      - name: Cache cargo files and outputs
        if: ${{ ( ! matrix.builds.cross ) && ( env.CARGO_CACHE ) }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.builds.runs-on }}-${{ matrix.builds.target }}-${{ matrix.builds.name }}
          save-if: ${{ github.ref == 'refs/heads/development' }}

      - name: Install and setup cargo cross
        if: ${{ matrix.builds.cross }}
        shell: bash
        run: |
          #cargo install cross
          cargo install cross --git https://github.com/cross-rs/cross
          echo "CARGO=cross" >> $GITHUB_ENV

      - name: Install and setup cargo-auditable
        if: ${{ ( ! matrix.builds.cross ) }}
        shell: bash
        run: |
          cargo install cargo-auditable cargo-audit
          echo "CARGO=${{ env.CARGO }} auditable" >> $GITHUB_ENV

      - name: Build release targets
        # if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          # echo "TS_BUILD=release" >> $GITHUB_ENV
          if [[ "${{ env.TS_BUILD }}" == "release" ]]; then
            echo "CARGO_OPTIONS=${{ env.CARGO_OPTIONS }} --${{ env.TS_BUILD }}" >> $GITHUB_ENV
          fi

      - name: Install Dependencies - TypeScript (globally)
        shell: bash
        run: |
          npm install -g typescript

      - name: Build Dependencies - Node (bindings)
        shell: bash
        working-directory: ${{ github.workspace }}/bindings
        run: |
          pnpm install
          pnpm run build-dev

      - name: Build Dependencies - Node (indexer_client)
        shell: bash
        working-directory: ${{ github.workspace }}/clients/javascript/indexer_client
        run: |
          pnpm install
          pnpm run build

      - name: Build Dependencies - Node (web UI theming)
        shell: bash
        working-directory: ${{ github.workspace }}/applications/theming
        run: |
          pnpm install
          pnpm run build

      - name: Build Dependencies - Node (wallet_daemon_client)
        shell: bash
        working-directory: ${{ github.workspace }}/clients/javascript/wallet_daemon_client
        run: |
          pnpm install
          pnpm run build

      # The indexer web UI builds the workspace's ootle-wasm-bor crate to decode the values the indexer serves.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: wasm-pack@0.15.0

      - name: Build Dependencies - applications (indexer)
        shell: bash
        working-directory: ${{ github.workspace }}/applications/tari_indexer/web_ui
        run: |
          pnpm install
          pnpm run build

      - name: Build Dependencies - applications (validator_node)
        shell: bash
        working-directory: ${{ github.workspace }}/applications/tari_validator_node/web_ui
        run: |
          pnpm install
          pnpm run build

      - name: Build Dependencies - applications (tari_walletd)
        shell: bash
        working-directory: ${{ github.workspace }}/applications/tari_walletd/web_ui
        run: |
          pnpm install
          pnpm run build

      # - name: Build Dependencies - applications (swarm)
      #   shell: bash
      #   #working-directory: ${{ github.workspace }}/applications/tari_swarm_daemon/web_ui
      #   working-directory: ${{ github.workspace }}/applications/tari_swarm_daemon/webui
      #   run: |
      #     pnpm install
      #     pnpm run build

      - name: Show command used for Cargo
        shell: bash
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "cargo options is: ${{ env.CARGO_OPTIONS }}"
          echo "cross flag: ${{ matrix.builds.cross }}"

      - name: Build release binaries
        timeout-minutes: 90
        shell: bash
        run: |
          ${{ env.CARGO }} build ${{ env.CARGO_OPTIONS }} \
            --target ${{ matrix.builds.target }} \
            --features "${{ env.BUILD_FEATURES }}" \
            ${{ env.TARGET_BINS }} \
            ${{ matrix.builds.flags }}

      - name: Build release libraries
        if: ${{ env.TS_LIBRARIES != '' }}
        shell: bash
        run: |
          ${{ env.CARGO }} build ${{ env.CARGO_OPTIONS }} \
            --target ${{ matrix.builds.target }} \
            --lib ${{ env.TARGET_LIBS }} \
            ${{ matrix.builds.flags }}

      - name: Copy binaries to folder for archiving
        shell: bash
        run: |
          # set -xo pipefail
          mkdir -p "$GITHUB_WORKSPACE${TS_DIST}"
          cd "$GITHUB_WORKSPACE${TS_DIST}"
          BINFILE="${TS_FILENAME}-${TARI_VERSION}-${VSHA_SHORT}-${{ matrix.builds.name }}${TS_EXT}"
          echo "BINFILE=${BINFILE}" >> $GITHUB_ENV
          echo "Copying files for ${BINFILE} to $(pwd)"
          echo "MTS_SOURCE=$(pwd)" >> $GITHUB_ENV
          ls -alht "$GITHUB_WORKSPACE/target/${{ matrix.builds.target }}/${{ env.TS_BUILD }}/"
          ARRAY_FILES=( $(echo ${TS_FILES} | jq --raw-output '.[]' | awk '{ print $1 }') )
          for FILE in "${ARRAY_FILES[@]}"; do
            echo "checking for file - ${FILE}${TS_EXT}"
            if [ -f "${GITHUB_WORKSPACE}/target/${{ matrix.builds.target }}/${{ env.TS_BUILD }}/${FILE}${TS_EXT}" ]; then
              cp -vf "${GITHUB_WORKSPACE}/target/${{ matrix.builds.target }}/${{ env.TS_BUILD }}/${FILE}${TS_EXT}" .
            fi
          done
          if [[ "${{ matrix.builds.target_libs }}" == "" ]]; then
            ARRAY_LIBS=( $(echo ${TS_LIBRARIES} | tr ', ' '\n') )
          else
            ARRAY_LIBS=( $(echo "${{ matrix.builds.target_libs }}" | tr ', ' '\n') )
          fi
          for FILE in "${ARRAY_LIBS[@]}"; do
            echo "checking for file - ${FILE}${TS_EXT}"
            # Check on Nix for libs
            if [ -f "${GITHUB_WORKSPACE}/target/${{ matrix.builds.target }}/${{ env.TS_BUILD }}/lib${FILE}${LIB_EXT}" ]; then
              cp -vf "${GITHUB_WORKSPACE}/target/${{ matrix.builds.target }}/${{ env.TS_BUILD }}/lib${FILE}${LIB_EXT}" .
            fi
            # Check on Windows libs
            if [ -f "${GITHUB_WORKSPACE}/target/${{ matrix.builds.target }}/${{ env.TS_BUILD }}/${FILE}${LIB_EXT}" ]; then
              cp -vf "${GITHUB_WORKSPACE}/target/${{ matrix.builds.target }}/${{ env.TS_BUILD }}/${FILE}${LIB_EXT}" .
            fi
          done
          if [ -f "${GITHUB_WORKSPACE}/applications/minotari_node/${PLATFORM_SPECIFIC_DIR}/runtime/start_tor${SHELL_EXT}" ]; then
            cp -vf "${GITHUB_WORKSPACE}/applications/minotari_node/${PLATFORM_SPECIFIC_DIR}/runtime/start_tor${SHELL_EXT}" .
          fi
          ls -alhtR ${{ env.MTS_SOURCE }}

      # codesign accepts a binary that links a third-party dylib; dyld then refuses to load it under
      # the hardened runtime. Every dynamic dependency must ship with macOS.
      - name: Check binaries link only system libraries - macOS
        if: startsWith(runner.os,'macOS')
        shell: bash
        run: |
          FAILED=0
          ARRAY_FILES=( $(echo ${TS_FILES} | jq --raw-output '.[]' | awk '{ print $1 }') )
          for FILE in "${ARRAY_FILES[@]}"; do
            BIN="${{ env.MTS_SOURCE }}/${FILE}"
            [ -f "${BIN}" ] || continue
            FOREIGN=$(otool -L "${BIN}" | tail -n +2 | awk '{ print $1 }' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
            if [ -n "${FOREIGN}" ]; then
              echo "::error::${FILE} links libraries that do not ship with macOS:"
              echo "${FOREIGN}"
              FAILED=1
            fi
          done
          exit ${FAILED}

      - name: Pre/unsigned OSX Artifact upload for Archive
        # Disabled
        if: ${{ false }}
        # if: startsWith(runner.os,'macOS')
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TS_FILENAME }}_unsigned-archive-${{ matrix.builds.name }}
          path: "${{ env.MTS_SOURCE }}/*"

      - name: Build the macOS Archive and code-sign
        if: ${{ ( startsWith(runner.os,'macOS') ) && ( env.MACOS_NOTARY_ISSUER != '' ) }}
        continue-on-error: true
        env:
          MACOS_KEYCHAIN_PASS: ${{ secrets.MACOS_KEYCHAIN_PASS }}
          MACOS_APPLICATION_ID: ${{ secrets.MACOS_APPLICATION_ID }}
          MACOS_APPLICATION_CERT: ${{ secrets.MACOS_APPLICATION_CERT }}
          MACOS_APPLICATION_PASS: ${{ secrets.MACOS_APPLICATION_PASS }}
          # MACOS_INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
          # MACOS_INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERT }}
          # MACOS_INSTALLER_PASS: ${{ secrets.MACOS_INSTALLER_PASS }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -xo pipefail
          echo "${MACOS_APPLICATION_CERT}" | base64 --decode > application.p12
          # echo "${MACOS_INSTALLER_CERT}" | base64 --decode > installer.p12
          security create-keychain -p ${MACOS_KEYCHAIN_PASS} build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ${MACOS_KEYCHAIN_PASS} build.keychain
          security import application.p12 -k build.keychain \
            -t cert -f pkcs12 \
            -P ${MACOS_APPLICATION_PASS} \
            -T /usr/bin/codesign
          # security import installer.p12 -k build.keychain \
          #   -t cert -f pkcs12 \
          #   -P ${MACOS_INSTALLER_PASS} \
          #   -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ${MACOS_KEYCHAIN_PASS} build.keychain

          # if [[ "${{ matrix.builds.name }}" == "macos-arm64" ]]; then
          #   echo "Add codesign extra args for ${{ matrix.builds.name }}"
          #   OSX_CODESIGN_EXTRAS="--entitlements ${GITHUB_WORKSPACE}/applications/minotari_node/osx-pkg/entitlements.xml"
          # fi

          # cd buildtools
          # export target_release="target/${{ matrix.builds.target }}/${{ env.TS_BUILD }}"

          # mkdir -p "${{ runner.temp }}/osxpkg"
          # export tarball_parent="${{ runner.temp }}/osxpkg"
          # export tarball_source="${{ env.TARI_NETWORK_DIR }}"
          # ./create_osx_install_zip.sh unused nozip

          ARRAY_FILES=( $(echo ${TS_FILES} | jq --raw-output '.[]' | awk '{ print $1 }') )

          # find "${GITHUB_WORKSPACE}/${target_release}" \
          #   -name "randomx-*" -type f -perm -+x \
          #   -exec cp -vf {} "${{ runner.temp }}/osxpkg/${{ env.TARI_NETWORK_DIR }}/runtime/" \;
          #   FILES_DIAG_UTILS=( \
          #     $(find "${GITHUB_WORKSPACE}/${target_release}" \
          #       -name "randomx-*" -type f -perm -+x \
          #         -exec sh -c 'echo "$(basename "{}")"' \; \
          #     ) \
          # )
          # ARRAY_FILES+=(${FILES_DIAG_UTILS[@]})

          # Codesign all files in ARRAY_FILES
          for FILE in "${ARRAY_FILES[@]}"; do
            # Codesign
            codesign --options runtime --force --verify --verbose --timestamp ${OSX_CODESIGN_EXTRAS} \
              --sign "Developer ID Application: ${MACOS_APPLICATION_ID}" \
              "${{ env.MTS_SOURCE }}/${FILE}"

            # Verify codesign
            codesign --verify --deep --display --verbose=4 \
              "${{ env.MTS_SOURCE }}/${FILE}"

            # cp -vf "${{ runner.temp }}/osxpkg/${{ env.TARI_NETWORK_DIR }}/runtime/${FILE}" \
            #   "${{ env.MTS_SOURCE }}"
          done

          # distDirPKG=$(mktemp -d -t ${{ env.TS_FILENAME }})
          # echo "${distDirPKG}"
          # echo "distDirPKG=${distDirPKG}" >> $GITHUB_ENV
          # TS_Temp=${{ env.TS_FILENAME }}
          # TS_BUNDLE_ID_VALID_NAME=$(echo "${TS_Temp//_/-}")
          # # Strip apple-darwin
          # TS_ARCH=$(echo "${${{ matrix.builds.target }}//-apple-darwin/}")
          # pkgbuild --root "${{ runner.temp }}/osxpkg/${{ env.TARI_NETWORK_DIR }}" \
          #   --identifier "${{ env.TS_BUNDLE_ID_BASE }}.pkg.${TS_BUNDLE_ID_VALID_NAME}" \
          #   --version "${TARI_VERSION}" \
          #   --install-location "/tmp/tari" \
          #   --scripts "${{ runner.temp }}/osxpkg/${{ env.TARI_NETWORK_DIR }}/scripts" \
          #   --sign "Developer ID Installer: ${MACOS_INSTALLER_ID}" \
          #   "${distDirPKG}/${{ env.TS_FILENAME }}-${{ matrix.builds.name }}-${{ env.TARI_VERSION }}.pkg"

          echo "Archive ${{ env.BINFILE }} too ${{ env.BINFILE }}.zip"
          cd "${{ env.MTS_SOURCE }}"
          echo "Compute files shasum"
          ${SHARUN} * >> "${{ env.BINFILE }}.sha256"
          echo "Show the shasum"
          cat "${{ env.BINFILE }}.sha256"
          echo "Checksum verification for files is "
          ${SHARUN} --check "${{ env.BINFILE }}.sha256"
          7z a "${{ env.BINFILE }}.zip" *

          printf '%s' "${MACOS_NOTARY_KEY}" > "${RUNNER_TEMP}/notary_key.p8"

          echo -e "Submitting to Apple...\n\n"
          xcrun notarytool submit \
            "${{ env.BINFILE }}.zip" \
            --key "${RUNNER_TEMP}/notary_key.p8" \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER}" \
            --verbose --wait 2>&1 | tee -a notarisation.result
          # Maybe use line from with "Processing complete"?
          requestUUID=$(tail -n5 notarisation.result | grep "id:" | cut -d" " -f 4)
          requestSTATUS=$(tail -n5 notarisation.result | grep "\ \ status:" | cut -d" " -f 4)
          if [[ ${requestUUID} == "" ]] || [[ ${requestSTATUS} != "Accepted" ]]; then
            echo "## status: ${requestSTATUS} - could not notarize - ${requestUUID} - ${{ env.BINFILE }}.zip"
            exit 1
          else
            echo "Notarization RequestUUID: ${requestUUID} - can't stapler archives"
            # echo -e "\nStapling package...\
            #   ${{ env.TS_FILENAME }}-${{ matrix.builds.name }}-${{ env.TARI_VERSION }}.pkg\n"
            # xcrun stapler staple -v \
