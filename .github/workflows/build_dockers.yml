---
name: Build docker image

'on':
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  schedule:
    # Nightly build, 5 min past midnight UTC, Sunday through Friday.
    - cron: '05 00 * * 0-5'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on adhoc branches (manual/scheduled builds).
  # Never cancel release tag builds.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IMAGE_NAME: ootle
  WALLETD_IMAGE_NAME: ootle-walletd

jobs:
  build:
    name: Build and push ootle images (linux/amd64)
    runs-on: [ self-hosted, ubuntu-high-cpu ]
    permissions:
      contents: read
      packages: write
    outputs:
      ootle_digest: ${{ steps.build.outputs.digest }}
      walletd_digest: ${{ steps.build_walletd.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=sha
          labels: |
            org.opencontainers.image.vendor=Tari Labs
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Tari Ootle network node binaries (validator_node, indexer)
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/ootle.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          # Registry cache, not GHA: the repo's 10 GB Actions cache is taken by the rust caches, so
          # the cooked-dependency layer was evicted before the next build could use it and every
          # build started cold. ghcr has no such cap.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract walletd metadata (tags, labels)
        id: meta_walletd
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.WALLETD_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=sha
          labels: |
            org.opencontainers.image.vendor=Tari Labs
            org.opencontainers.image.title=${{ env.WALLETD_IMAGE_NAME }}
            org.opencontainers.image.description=Tari Ootle wallet daemon (tari_ootle_walletd)
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Same builder as the step above, so the compiled binaries are reused and only the walletd stage is new.
      - name: Build and push walletd
        id: build_walletd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/ootle.Dockerfile
          target: walletd
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-buildcache
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta_walletd.outputs.tags }}
          labels: ${{ steps.meta_walletd.outputs.labels }}

      - name: Summary
        run: |
          echo "## Built images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**ootle digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**ootle-walletd digest:** \`${{ steps.build_walletd.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta_walletd.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Signing runs on a GitHub-hosted runner so the self-hosted runner, which also runs pull request
  # jobs, never holds an OIDC signing token.
  sign:
    name: Sign images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signing the digest covers every tag that points at it.
      - name: Sign images
        env:
          OOTLE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.ootle_digest }}
          WALLETD_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.WALLETD_IMAGE_NAME }}@${{ needs.build.outputs.walletd_digest }}
        run: |
          cosign sign --yes "$OOTLE_IMAGE"
          cosign sign --yes "$WALLETD_IMAGE"
