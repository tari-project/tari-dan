---
name: Publish ootle-wasm to npmjs

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:

env:
  WASM_PACK_VERSION: '0.15.0'

permissions:
  id-token: write
  contents: read

jobs:
  publish-ootle-wasm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { crate: wasm, pkg: pkg }
          - { crate: bor, pkg: pkg-bor }
    defaults:
      run:
        working-directory: crates/ootle_wasm
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Runs on tags, whose cache entries nothing can restore
          save-if: ${{ github.ref == 'refs/heads/development' }}

      - name: ubuntu dependencies
        run: |
          sudo apt-get update
          sudo bash ../../scripts/install_ubuntu_dependencies.sh

      - name: Set up Rust target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: "https://registry.npmjs.org"
          node-version-file: .nvmrc

      - name: Build WASM package
        run: bash build.sh bundler release ${{ matrix.package.crate }}

      - name: Publish to NPM
        working-directory: crates/ootle_wasm/${{ matrix.package.pkg }}
        run: |
          echo "== Local package.json =="
          node -e "const p=require('./package.json'); console.log({name:p.name, version:p.version})"

          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          echo "Local version: $LOCAL_VERSION"
          echo "Package name:  $PACKAGE_NAME"

          echo "== Registry check =="
          echo "Running: npm view $PACKAGE_NAME version"

          REMOTE_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "NOT_FOUND")
          echo "Remote version: $REMOTE_VERSION"

          if [ "$REMOTE_VERSION" = "$LOCAL_VERSION" ]; then
            echo "Version $LOCAL_VERSION already published, skipping."
            exit 0
          fi

          echo "== Publishing =="
          npm publish --provenance
