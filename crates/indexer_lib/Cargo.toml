[package]
name = "tari_indexer_lib"
publish = false
description = "Network scanning and indexing library"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_common_types = { workspace = true }
tari_ootle_common_types = { workspace = true }
tari_ootle_storage = { workspace = true }
tari_epoch_manager = { workspace = true }
ootle-network = { workspace = true }
tari_engine_types = { workspace = true }
tari_validator_node_rpc = { workspace = true }

async-trait = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

prometheus-client = { workspace = true, optional = true }

[dev-dependencies]
tari_consensus_types = { workspace = true }
tari_crypto = { workspace = true }
anyhow = { workspace = true }
tari_bor = { workspace = true, default-features = true }
tari_sidechain = { workspace = true }
tari_state_tree = { workspace = true }
tari_ootle_transaction = { workspace = true }
tari_template_lib_types = { workspace = true }

tokio = { workspace = true, default-features = false, features = ["rt", "macros", "time", "sync"] }

[features]
metrics = ["prometheus-client"]