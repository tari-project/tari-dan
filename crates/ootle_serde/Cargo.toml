[package]
name = "ootle_serde"
version = "0.6.0"
description = "serde utilities for Tari Ootle"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_bor = { workspace = true, optional = true, features = ["std", "serde"] }

serde = { workspace = true, features = ["alloc"] }
base64 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
tari_bor = { workspace = true, features = ["std", "serde"] }

[features]
default = ["std", "hex", "cbor"]
std = ["serde/std"]
# The hex, base64 and cbor adapters pull in dependencies that are built with std.
hex = ["dep:hex", "std"]
cbor = ["dep:tari_bor", "std"]
base64 = ["dep:base64", "std"]