[package]
name = "tari_sidechain"
description = "Tari Ootle sidechain commit proofs, burn claim proofs and consensus hashers"
version = "7.0.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_hashing = { workspace = true }
tari_crypto = { workspace = true, features = ["borsh"] }
tari_utilities = { workspace = true }
tari_jellyfish = { workspace = true }

log = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true, features = ["std"] }
borsh = { workspace = true, features = ["std", "derive"] }
digest = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }

[dev-dependencies]
serde_json = { workspace = true }
