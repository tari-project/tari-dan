[package]
name = "tari_epoch_manager"
publish = false
description = "The Tari epoch manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_sidechain = { workspace = true }
minotari_app_grpc = { workspace = true }
tari_ootle_common_types = { workspace = true }
tari_ootle_storage = { workspace = true }
tari_ootle_storage_sqlite = { workspace = true, optional = true }
tari_state_tree = { workspace = true }
tari_template_lib_types = { workspace = true }
tari_shutdown = { workspace = true }
ootle_byte_type = { workspace = true, features = ["crypto"] }
ootle-network = { workspace = true }

anyhow = { workspace = true }
log = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["sync"] }
serde = { workspace = true }

[dev-dependencies]
diesel = { workspace = true, default-features = false, features = ["sqlite"] }
tokio = { workspace = true, default-features = false, features = ["rt-multi-thread", "macros"] }

[features]
service = [
    "log",
    "tari_ootle_storage_sqlite",
]
