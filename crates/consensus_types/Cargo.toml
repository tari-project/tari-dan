[package]
name = "tari_consensus_types"
description = "Consensus types for Tari Ootle"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_common_types = { workspace = true }
tari_ootle_common_types = { workspace = true }
tari_sidechain = { workspace = true }
ootle-network = { workspace = true }
tari_hashing = { workspace = true }
tari_template_lib = { workspace = true }
tari_engine_types = { workspace = true }
tari_crypto = { workspace = true }
ootle_serde = { workspace = true, features = ["std", "hex"] }
tari_bor = { workspace = true, features = ["serde"] }
minicbor = { workspace = true, default-features = false, features = ["alloc", "derive"] }

borsh = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
ts = ["ts-rs", "tari_engine_types/ts", "tari_template_lib/ts", "tari_ootle_common_types/ts"]
