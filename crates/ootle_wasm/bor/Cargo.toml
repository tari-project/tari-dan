[package]
name = "ootle-wasm-bor"
description = "WASM decoders for the Tari Ootle values the indexer serves in their CBOR encoding"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ootle-wasm-core = { workspace = true }
wasm-bindgen = "0.2"
# The wasm32-unknown-unknown target needs these features on both getrandom versions in the graph, as in ootle-wasm.
getrandom = { version = "0.2", features = ["js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
js-sys = "0.3"

[package.metadata.cargo-machete]
ignored = [
    # getrandom is only needed to enable the js/wasm_js feature transitively
    "getrandom",
    "getrandom_v04",
]
