[package]
name = "tari_jellyfish"
description = "Jellyfish Merkle Tree implementation for Tari"
version = "6.2.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_hashing = { workspace = true }
tari_crypto = { workspace = true }

serde = { workspace = true, features = ["std", "derive"] }
borsh = { workspace = true, features = ["std", "derive"] }
digest = { workspace = true }
thiserror = { workspace = true }
minicbor = { workspace = true, optional = true }

[features]
# In-memory `TreeStore` for tests and tooling. Not for production use.
memory-store = []
# Native minicbor `Encode`/`Decode`/`CborLen` for the tree, node and proof types.
minicbor = ["dep:minicbor"]

[dev-dependencies]
serde_json = { workspace = true }
