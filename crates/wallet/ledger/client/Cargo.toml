[package]
name = "ootle_ledger_client"
version = "0.10.0"
description = "Host client for the Tari Ootle Ledger app: on-device key derivation and transaction signing over any APDU transport"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
ootle_ledger_common = { workspace = true }
tari_template_lib_types = { workspace = true }

ledger-transport = "0.11.0"
ledger-transport-hid = { version = "0.11.0", optional = true }
thiserror = { workspace = true }

# Speculos transport
reqwest = { workspace = true, features = ["json"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
hex = { workspace = true, optional = true }
borsh = { workspace = true, default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Host reference test that proves the device signing recipe produces valid transaction signatures.
tari_ootle_transaction = { workspace = true }
tari_ootle_wallet_crypto = { workspace = true }
ootle-network = { workspace = true }
tari_crypto = { workspace = true }
curve25519-dalek = { version = "4", features = ["rand_core"] }
blake2 = { workspace = true }
merlin = { workspace = true }
tari_ootle_common_types = { workspace = true }
rand = { workspace = true }
indexmap = { workspace = true }

[features]
speculos-transport = ["serde", "reqwest", "hex"]
hid-transport = ["dep:ledger-transport-hid"]

[package.metadata.docs.rs]
all-features = true