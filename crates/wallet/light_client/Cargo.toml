[package]
name = "tari_ootle_light_client"
version = "0.1.0"
description = "Verifies Tari Ootle indexer responses against the validator set handover chain"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
ootle-network = { workspace = true, features = ["serde"] }
tari_engine_types = { workspace = true }
tari_indexer_client = { workspace = true }
tari_ootle_common_types = { workspace = true }
tari_ootle_storage = { workspace = true }
tari_ootle_transaction = { workspace = true }
tari_state_tree = { workspace = true }
tari_template_lib_types = { workspace = true }
tari_bor = { workspace = true }

serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

# test-fixtures
indexmap = { workspace = true, optional = true }
tari_common_types = { workspace = true, optional = true }
tari_crypto = { workspace = true, optional = true }
tari_sidechain = { workspace = true, optional = true }

[dev-dependencies]
tari_ootle_light_client = { path = ".", features = ["test-fixtures"] }

[features]
# Signed fixtures for tests of crates that verify with the light client.
test-fixtures = ["dep:indexmap", "dep:tari_common_types", "dep:tari_crypto", "dep:tari_sidechain"]
