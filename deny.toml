# Supply-chain policy for `cargo deny check`, run by `.github/workflows/cargo-deny.yml` on every
# pull request.
#
# Schema: cargo-deny 0.20. Values the older schema carried and this one does not — `vulnerability`,
# `notice`, `unlicensed`, `copyleft`, `allow-osi-fsf-free` — are now fixed: a security advisory and
# an unmatched or absent license are errors, and nothing else is inferred from a license's OSI or
# FSF status.

[graph]
# The widest graph: a dependency reachable only under a feature is still a dependency this
# repository ships. `.github/workflows/cargo-deny.yml` passes `--all-features` to match.
all-features = true
no-default-features = false
# Every target the workspace ships for. Empty means all of them, which is what a validator binary,
# the wasm guest and the ledger app together amount to.
targets = []

[output]
feature-depth = 1

# Part of the pull-request gate, alongside bans, licences and sources — see
# `.github/workflows/cargo-deny.yml`. A newly published advisory against anything in the tree turns
# every pull request red until someone either bumps the crate or writes an entry below, which is
# the intended cost: an advisory nobody has looked at is the state this check exists to end.
# `rustsec/audit-check` still reports nightly in `.github/workflows/audit.yml` and opens an issue
# per finding, so a new advisory is visible before a pull request runs into it.
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate in the lockfile is a release the registry withdrew. It is rare enough to be worth
# stopping for.
yanked = "deny"
# Unmaintained advisories are reported for the workspace's own dependency tree only. A transitive
# unmaintained crate is a fact about a dependency's choices, not something this repository can act
# on, and reporting it here only trains people to ignore the check.
unmaintained = "workspace"
# Every ignore needs a reason and a way out. An entry with neither is a permanent exception nobody
# will revisit.
#
# Reachability below is per binary (`cargo tree -p <bin> -i <crate>`) rather than across the
# workspace: `--all-features` over every member unions graphs that are never linked together, so a
# crate the workspace "depends on" can be absent from everything this project ships. Being absent
# from every binary is a reason to rank an advisory, never on its own a reason to keep it: each
# entry here also has to say why the fix is out of reach.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = """
Marvin timing sidechannel in RSA private-key operations, with no patched release. Absent from every
binary this project ships: `pgp` is an optional dependency of `tari_p2p`, enabled only by its
`auto-update` feature, which only the base layer's own `minotari_node` and wallet binaries turn on.
It reaches the graph because `integration_tests` runs those binaries to stand up a local L1. What
`tari_p2p` does with it is verify detached signatures on release hash files against maintainer
public keys, which performs no private-key operation and so offers no timing oracle. Revisit if
`rsa` publishes a fix or the L1 drops `pgp`.""" },
    # zip 3.0.0 is a build dependency of `utoipa-swagger-ui` 9, which unpacks the Swagger UI assets for
    # the L1's `minotari_node`, reached only through `integration_tests`. It is absent from every
    # binary this project ships. Remove these three once `minotari_node` moves to
    # `utoipa-swagger-ui` 10 (zip `^9`).
    { id = "RUSTSEC-2026-0367", reason = """
zip keeps SUID/SGID bits on files it extracts. Unreachable: `utoipa-swagger-ui`'s build script never
calls zip's extract APIs, and the archive it unpacks is a pinned Swagger UI release fetched over HTTPS
by an unprivileged build.""" },
    { id = "RUSTSEC-2026-0368", reason = """
`ZipArchive::extract` creates symlinks pointing outside the destination. Unreachable:
`utoipa-swagger-ui`'s build script walks entries with `by_index` and `enclosed_name`, writes regular
files itself and never creates symlinks or calls `extract`.""" },
    { id = "RUSTSEC-2026-0369", reason = """
`ZipStreamReader::extract` and `ZipArchive::extract` apply permissions through symlinks. Unreachable:
`utoipa-swagger-ui`'s build script calls neither and creates no symlinks.""" },
]

[licenses]
# Permissive licenses only. Anything not listed here fails the check — there is no default-allow.
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "BSL-1.0",
    "WTFPL",
    "MPL-2.0",
    "Zlib",
    # `libbz2-rs-sys`, reached through the integration tests. BSD-style, permissive.
    "bzip2-1.0.6",
    # `webpki-root-certs`. A data licence over the root store, permissive.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false

[bans]
# Duplicate versions are a warning rather than an error: a large tree always carries some, and the
# ones that matter are called out by the skip list below.
multiple-versions = "warn"
# A `*` version requirement accepts whatever the registry serves next.
wildcards = "deny"
# Except a path dependency, which resolves to a directory in this repository rather than to
# whatever a registry serves. The workspace's own crates are wired up that way.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
# Version floors for transitive crates with a fix the advisories check does not enforce: an unsound
# advisory is reported for direct dependencies only, so a lockfile that resolves back below the
# patched release would otherwise pass.
deny = [
    # `StackSlot` implements `Send` and `Sync` regardless of its tag type. Reached through
    # `libp2p-gossipsub` via `async-channel`.
    { crate = "event-listener:>=5.1.0, <5.4.2", reason = "StackSlot is Send/Sync for any tag; fixed in 5.4.2" },
]
skip = []
skip-tree = []

[sources]
# A crate from anywhere other than crates.io is a supply-chain decision, so it has to be written
# down here rather than arrived at through a transitive dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # The project's own libp2p fork, which the networking stack is built on.
    "https://github.com/tari-project/rust-libp2p.git",
]
